databaseChangeLog:
  - changeSet:
      id: 002-igdb-schema-setup/03-create-collection-table
      author: Quentin Sebille
      changes:
        - createTable:
            schemaName: igdb
            tableName: collection
            columns:
              - column: { name: id, type: int, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_collection } }
              - column: { name: name, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TRIGGER trg_igdb_collection_set_updated_at
                            BEFORE UPDATE ON igdb.collection
                            FOR EACH ROW
                            EXECUTE FUNCTION igdb.set_updated_at();
