databaseChangeLog:
  - changeSet:
      id: 002-igdb-schema-setup/04-create-company-table
      author: Quentin Sebille
      changes:
        - createTable:
            schemaName: igdb
            tableName: company
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_company } }
              - column: { name: name, type: text, constraints: { nullable: false } }
              - column: { name: country_code, type: int }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TRIGGER trg_igdb_company_set_updated_at
                            BEFORE UPDATE ON igdb.company
                            FOR EACH ROW
                            EXECUTE FUNCTION igdb.set_updated_at();
