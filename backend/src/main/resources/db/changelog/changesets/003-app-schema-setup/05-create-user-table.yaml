databaseChangeLog:
  - changeSet:
      id: 003-app-schema-setup/05-create-user-table
      author: Quentin Sebille
      changes:
        - createTable:
            schemaName: app
            tableName: user
            columns:
              - column: { name: id,type: uuid, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_user } }
              - column: { name: email, type: varchar }
              - column: { name: display_name, type: varchar }
              - column: { name: cognito_sub, type: varchar, constraints: { nullable: false, unique: true } }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TRIGGER trg_app_user_set_updated_at
                            BEFORE UPDATE ON app.user
                            FOR EACH ROW
                            EXECUTE FUNCTION app.set_updated_at();
      
