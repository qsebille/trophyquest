databaseChangeLog:
  - changeSet:
      id: 001-psn-schema-setup/03-create-player-table
      author: Quentin Sebille
      changes:
        - createTable:
            schemaName: psn
            tableName: player
            columns:
              - column: { name: id, type: uuid, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_player } }
              - column: { name: pseudo, type: text, constraints: { nullable: false } }
              - column: { name: psn_avatar_url, type: text }
              - column: { name: aws_avatar_url, type: text }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TRIGGER trg_psn_player_set_updated_at
                            BEFORE UPDATE ON psn.player
                            FOR EACH ROW
                            EXECUTE FUNCTION psn.set_updated_at();