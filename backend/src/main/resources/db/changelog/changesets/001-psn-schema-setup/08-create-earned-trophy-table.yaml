databaseChangeLog:
  - changeSet:
      id: 001-psn-schema-setup/08-create-earned-trophy-table
      author: Quentin Sebille
      changes:
        - createTable:
            schemaName: psn
            tableName: earned_trophy
            columns:
              - column: { name: player_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_player, references: psn.player(id) } }
              - column: { name: trophy_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_trophy, references: psn.trophy(id) } }
              - column: { name: earned_at, type: timestamptz }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - addPrimaryKey:
            schemaName: psn
            tableName: earned_trophy
            columnNames: trophy_id,player_id
            constraintName: pk_earned_trophy

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TRIGGER trg_psn_earned_trophy_set_updated_at
                            BEFORE UPDATE ON psn.earned_trophy
                            FOR EACH ROW
                            EXECUTE FUNCTION psn.set_updated_at();